<section id="contact" class="section-padding relative overflow-hidden">
  <div class="absolute inset-0 dot-grid opacity-20"></div>

  <!-- Decorative orb -->
  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] rounded-full opacity-[0.03] pointer-events-none"
    [class]="theme.isDark() ? 'bg-[#C7F36B]' : 'bg-[#4D7A0A]'"
    style="animation: morph 20s ease-in-out infinite;"></div>

  <div class="section-container relative z-10">
    <div class="max-w-3xl mx-auto text-center">
      <!-- Header -->
      <div appReveal="fade-up">
        <span [class]="'section-label justify-center mb-4 ' + (theme.isDark() ? 'text-[#C7F36B]' : 'text-[#4D7A0A]')">Get In Touch</span>
        <h2 [class]="'section-heading text-3xl md:text-4xl lg:text-[3.5rem] mt-4 mb-6 ' + (theme.isDark() ? 'text-[#EFF2EA]' : 'text-[#141E16]')">
          Have a project in mind?<br>
          <span [class]="theme.isDark() ? 'text-[#C7F36B]' : 'text-[#4D7A0A]'">Let's build something great.</span>
        </h2>
        <p [class]="'text-base md:text-lg leading-relaxed mb-14 max-w-xl mx-auto ' + (theme.isDark() ? 'text-[#8A9A8C]' : 'text-[#566858]')">
          I'm always open to discussing new projects, opportunities, and ideas. Feel free to reach out through any channel below.
        </p>
      </div>

      <!-- Contact Cards -->
      <div class="grid sm:grid-cols-3 gap-4 mb-14" appReveal="fade-up" [revealDelay]="0.15">
        <!-- Email -->
        <a [href]="'mailto:' + email"
          [class]="'glass-card group p-7 text-center hover:-translate-y-1 hover:shadow-lg ' + (theme.isDark() ? 'hover:shadow-[#C7F36B]/5' : 'hover:shadow-[#4D7A0A]/5')">
          <div [class]="'inline-flex items-center justify-center w-12 h-12 rounded-xl mb-5 transition-all duration-300 group-hover:scale-110 ' + (theme.isDark() ? 'bg-[#C7F36B]/10 text-[#C7F36B] group-hover:bg-[#C7F36B]/20' : 'bg-[#4D7A0A]/10 text-[#4D7A0A] group-hover:bg-[#4D7A0A]/20')">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
          </div>
          <p [class]="'text-sm font-semibold mb-1 ' + (theme.isDark() ? 'text-[#EFF2EA]' : 'text-[#141E16]')">Email</p>
          <p [class]="'text-xs font-mono ' + (theme.isDark() ? 'text-[#5C6E5E]' : 'text-[#8B9A8D]')">{{ email }}</p>
        </a>

        <!-- LinkedIn -->
        <a href="https://www.linkedin.com/in/amira-ashour-0ba733350/" target="_blank" rel="noopener noreferrer"
          [class]="'glass-card group p-7 text-center hover:-translate-y-1 hover:shadow-lg ' + (theme.isDark() ? 'hover:shadow-[#C7F36B]/5' : 'hover:shadow-[#4D7A0A]/5')">
          <div [class]="'inline-flex items-center justify-center w-12 h-12 rounded-xl mb-5 transition-all duration-300 group-hover:scale-110 ' + (theme.isDark() ? 'bg-[#C7F36B]/10 text-[#C7F36B] group-hover:bg-[#C7F36B]/20' : 'bg-[#4D7A0A]/10 text-[#4D7A0A] group-hover:bg-[#4D7A0A]/20')">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect width="4" height="12" x="2" y="9"/><circle cx="4" cy="4" r="2"/></svg>
          </div>
          <p [class]="'text-sm font-semibold mb-1 ' + (theme.isDark() ? 'text-[#EFF2EA]' : 'text-[#141E16]')">LinkedIn</p>
          <p [class]="'text-xs font-mono ' + (theme.isDark() ? 'text-[#5C6E5E]' : 'text-[#8B9A8D]')">Connect</p>
        </a>

        <!-- GitHub -->
        <a href="https://github.com/AmiraAshour" target="_blank" rel="noopener noreferrer"
          [class]="'glass-card group p-7 text-center hover:-translate-y-1 hover:shadow-lg ' + (theme.isDark() ? 'hover:shadow-[#C7F36B]/5' : 'hover:shadow-[#4D7A0A]/5')">
          <div [class]="'inline-flex items-center justify-center w-12 h-12 rounded-xl mb-5 transition-all duration-300 group-hover:scale-110 ' + (theme.isDark() ? 'bg-[#C7F36B]/10 text-[#C7F36B] group-hover:bg-[#C7F36B]/20' : 'bg-[#4D7A0A]/10 text-[#4D7A0A] group-hover:bg-[#4D7A0A]/20')">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>
          </div>
          <p [class]="'text-sm font-semibold mb-1 ' + (theme.isDark() ? 'text-[#EFF2EA]' : 'text-[#141E16]')">GitHub</p>
          <p [class]="'text-xs font-mono ' + (theme.isDark() ? 'text-[#5C6E5E]' : 'text-[#8B9A8D]')">View projects</p>
        </a>
      </div>

      <!-- CTA button -->
      <div appReveal="fade-up" [revealDelay]="0.25">
        <a [href]="'mailto:' + email"
          [appMagnetic]="0.15"
          class="group relative inline-flex items-center gap-3 px-10 py-5 rounded-2xl text-base font-bold bg-[#C7F36B] text-[#0A0F0C] overflow-hidden transition-all duration-300 hover:shadow-2xl hover:shadow-[#C7F36B]/20">
          <span class="absolute inset-0 bg-gradient-to-r from-white/0 via-white/25 to-white/0 translate-x-[-200%] group-hover:translate-x-[200%] transition-transform duration-700"></span>
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="relative"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
          <span class="relative">Send Me an Email</span>
        </a>
      </div>
    </div>
  </div>
</section>
