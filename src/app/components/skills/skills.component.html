<section id="skills" class="section-padding relative overflow-hidden">
  <div class="absolute inset-0 dot-grid opacity-20"></div>

  <div class="section-container relative z-10">
    <!-- Section Header -->
    <div class="mb-12 md:mb-20" appReveal="fade-up">
      <span [class]="'section-label mb-4 ' + (theme.isDark() ? 'text-[#C7F36B]' : 'text-[#4D7A0A]')">Technical Skills</span>
      <h2 [class]="'section-heading text-3xl md:text-4xl lg:text-5xl mt-4 ' + (theme.isDark() ? 'text-[#EFF2EA]' : 'text-[#141E16]')">
        Technologies I<br>
        <span [class]="theme.isDark() ? 'text-[#C7F36B]' : 'text-[#4D7A0A]'">work with</span>
      </h2>
    </div>

    <div class="grid lg:grid-cols-12 gap-6 lg:gap-8 items-start">
      <!-- Category Sidebar -->
      <div class="lg:col-span-4 min-w-0" appReveal="fade-right" [revealDelay]="0.1">
        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-1 gap-2">
          @for (cat of categories; track cat.title; let i = $index) {
            <button
              (click)="activeCategory.set(i)"
              [class]="'group flex items-center gap-2.5 lg:gap-4 px-3.5 lg:px-5 py-3 lg:py-4 rounded-xl text-left transition-all duration-300 min-w-0 ' +
                (activeCategory() === i
                  ? (theme.isDark()
                      ? 'bg-[#C7F36B]/10 border border-[#C7F36B]/20 text-[#C7F36B]'
                      : 'bg-[#4D7A0A]/10 border border-[#4D7A0A]/20 text-[#4D7A0A]')
                  : (theme.isDark()
                      ? 'border border-transparent text-[#8A9A8C] hover:text-[#EFF2EA] hover:bg-[#131C17]'
                      : 'border border-transparent text-[#566858] hover:text-[#141E16] hover:bg-white'))"
            >
              <span [class]="'flex items-center justify-center w-9 h-9 lg:w-10 lg:h-10 rounded-lg transition-all duration-300 shrink-0 ' +
                (activeCategory() === i
                  ? (theme.isDark() ? 'bg-[#C7F36B]/20' : 'bg-[#4D7A0A]/20')
                  : (theme.isDark() ? 'bg-[#131C17]' : 'bg-[#EDEEE8]'))">
                @switch (cat.icon) {
                  @case ('server') {
                    <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="8" x="2" y="2" rx="2" ry="2"/><rect width="20" height="8" x="2" y="14" rx="2" ry="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>
                  }
                  @case ('layout') {
                    <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
                  }
                  @case ('database') {
                    <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></svg>
                  }
                  @case ('blocks') {
                    <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="14" y="3" rx="1"/><path d="M10 21V8a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-5a1 1 0 0 0-1-1H3"/></svg>
                  }
                  @case ('wrench') {
                    <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
                  }
                }
              </span>
              <span class="min-w-0">
                <span class="text-xs lg:text-sm font-semibold block leading-snug break-words">{{ cat.title }}</span>
                <span [class]="'text-[10px] lg:text-[11px] font-mono ' + (theme.isDark() ? 'text-[#5C6E5E]' : 'text-[#8B9A8D]')">{{ cat.skills.length }} skills</span>
              </span>
            </button>
          }
        </div>
      </div>

      <!-- Skills Display -->
      <div class="lg:col-span-8 min-w-0" appReveal="fade-up" [revealDelay]="0.2">
        <div class="glass-card p-5 sm:p-8 lg:p-10 min-h-[240px]">
          <div class="flex items-center gap-3 mb-6 lg:mb-8">
            <div [class]="'w-2 h-2 rounded-full shrink-0 ' + (theme.isDark() ? 'bg-[#C7F36B]' : 'bg-[#4D7A0A]')"></div>
            <h3 [class]="'text-base lg:text-lg font-semibold ' + (theme.isDark() ? 'text-[#EFF2EA]' : 'text-[#141E16]')">
              {{ categories[activeCategory()].title }}
            </h3>
          </div>

          <div class="grid grid-cols-1 min-[400px]:grid-cols-2 lg:grid-cols-3 gap-2.5 lg:gap-3">
            @for (skill of categories[activeCategory()].skills; track skill; let j = $index) {
              <span
                [class]="'group inline-flex items-center gap-2.5 min-w-0 px-3.5 lg:px-4 py-2.5 lg:py-3 rounded-xl text-[13px] lg:text-sm font-medium border cursor-default transition-all duration-300 hover:-translate-y-0.5 hover:shadow-md ' +
                  (theme.isDark()
                    ? 'bg-[#0A0F0C] border-[#1F2F24] text-[#EFF2EA] hover:border-[#C7F36B]/40 hover:text-[#C7F36B] hover:shadow-[#C7F36B]/5'
                    : 'bg-[#F7F8F4] border-[#D5DCD0] text-[#141E16] hover:border-[#4D7A0A]/40 hover:text-[#4D7A0A] hover:shadow-[#4D7A0A]/5')"
                [style.animation-delay]="(j * 0.03) + 's'"
                style="animation: fadeSlideUp 0.4s ease-out both;"
              >
                <span [class]="'w-1.5 h-1.5 rounded-full shrink-0 transition-colors ' + (theme.isDark() ? 'bg-[#1F2F24] group-hover:bg-[#C7F36B]' : 'bg-[#D5DCD0] group-hover:bg-[#4D7A0A]')"></span>
                <span class="min-w-0 break-words">{{ skill }}</span>
              </span>
            }
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<style>
@keyframes fadeSlideUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
